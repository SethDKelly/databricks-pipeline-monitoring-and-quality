schema_version: "1.0"
phase: DPTN-F
status: accepted
scenarios:
  - id: DPTNF-01
    expectation: Repository-native discovery begins at docs/index.md.
  - id: DPTNF-02
    expectation: knowledge/index.md remains generated OKF compatibility only.
  - id: DPTNF-03
    expectation: Tool compatibility profiles select docs/index.md as the primary knowledge entry.
  - id: DPTNF-04
    expectation: Tool compatibility profiles retain knowledge/index.md only as an explicit OKF compatibility entry.
  - id: DPTNF-05
    expectation: resolve-context uses docs/index.md when semantic location is unknown.
  - id: DPTNF-06
    expectation: Exact stable IDs bypass discovery and resolve through scripts/agentic/resolve_stable_id.py.
  - id: DPTNF-07
    expectation: Current stable-ID resolution returns exactly one owner_path::STABLE-ID locator.
  - id: DPTNF-08
    expectation: Historical stable-ID discovery requires explicit --history and cannot compete with current ownership.
  - id: DPTNF-09
    expectation: Current routing never chooses authority by first match, search rank, recency or path presence.
  - id: DPTNF-10
    expectation: Cursor design/change-control routing references first-class current owners rather than Phase 010 paths.
  - id: DPTNF-11
    expectation: Evidence/temporal Cursor routing references current contracts and architecture owners.
  - id: DPTNF-12
    expectation: Identity/governance Cursor routing references current authority and architecture owners.
  - id: DPTNF-13
    expectation: Acquisition/integration Cursor routing references current integration and acquisition owners.
  - id: DPTNF-14
    expectation: Health/Lineage/Impact Cursor routing references current contracts and architecture owners.
  - id: DPTNF-15
    expectation: Investigation/reasoning/explanation Cursor routing references current experience/contracts/architecture owners.
  - id: DPTNF-16
    expectation: Serving/security Cursor routing references current architecture, authority and experience owners.
  - id: DPTNF-17
    expectation: Active-control Cursor routing references current control contracts, authority and architecture owners.
  - id: DPTNF-18
    expectation: Current agentic link validation requires real current targets and has no DPTN-D history fallback.
  - id: DPTNF-19
    expectation: Knowledge-impact review uses CKR-inventoried first-class current owner roots rather than docs/canonical compatibility paths.
  - id: DPTNF-20
    expectation: Completed CKR validators may use only the dedicated ephemeral accepted-era compatibility wrapper.
  - id: DPTNF-21
    expectation: The DPTN-E generated OKF tree remains unchanged by DPTN-F.
  - id: DPTNF-22
    expectation: All eight substantive semantic owner trees remain byte-for-byte at their DPTN-E SHAs.
  - id: DPTNF-23
    expectation: The 24 concepts, 1237 stable IDs, eight stable families and ARCH-001..ARCH-500 remain conserved while Implementation 001-A stays blocked.
  - id: DPTNF-24
