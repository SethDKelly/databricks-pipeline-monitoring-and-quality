name: Documentation consistency

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "scripts/check_docs_consistency.py"
      - ".github/workflows/docs-consistency.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "scripts/check_docs_consistency.py"
      - ".github/workflows/docs-consistency.yml"

permissions:
  contents: read

jobs:
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check documentation phase status
        run: python3 scripts/check_docs_consistency.py
